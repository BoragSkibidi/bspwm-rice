#################################
#             Shadows           #
#################################
# shadow = false
# crop-shadow-to-monitor = false


#################################
#           Fading              #
#################################
fading = false;
# fade-in-step = 0.05;
# fade-out-step = 0.05;
# fade-delta = 10
# no-fadingj-openclose = false
# no-fading-destroyed-argb = false


#################################
#   Transparency / Opacity      #
#################################
# frame-opacity = 1;
# inactive-dim-fixed = true


#################################
#           Borders             #
#################################
round-borders = 1;



#################################
#           Corners             #
#################################
corner-radius = 10


#################################
#         Animations            #
#################################
animations = true;

# animation-for-open-window = "zoom";
# animation-for-transient-window = "zoom";
# animation-for-unmap-window = "zoom";


# animation-stiffness = 1000.0;
# animation-dampening = 0.0;
# animation-mass = 1;
# animation-clamping = true;
# animation-delta = 100;

animation-force-steps = true;



#################################
#            Blur               #
#################################
# blur-method =
# blur-size = 12
# blur-deviation = false
# blur-strength = 5
# blur-background = false
# blur-background-frame = false
# blur-background-fixed = false
# blur-kern = "3x3box";

#################################
#       General Settings        #
#################################
# dbus = true
# daemon = false
backend = "glx"
# glx-no-stencil = true;
# glx-no-rebind-pixmap = true;
dithered-present = false;
vsync = false;
detect-rounded-corners = true;
detect-client-opacity = true;
use-ewmh-active-win = true;
# unredir-if-possible = true;
# unredir-if-possible-delay = 1000
detect-transient = true;
detect-client-leader = false
use-damage = true;
# xrender-sync-fence = false
# window-shader-fg = "default"
# force-win-blend = false
# no-ewmh-fullscreen = false
# max-brightness = 1.0
# transparent-clipping = false
# log-level = "warn";
# log-file = "/path/to/your/log/file"
# write-pid-path = "/path/to/your/log/file"



#################################
#             Rules             #
#################################
rules: (
    {
        match = "window_type = 'tooltip'";
        fade = false;
        shadow = false; # <- fixed: added missing semicolon
        opacity = 0.75;
        full-shadow = false;
    }, {
        match = "window_type = 'dock'    || "
                "window_type = 'desktop' || "
                "_GTK_FRAME_EXTENTS@";
        blur-background = false;
    }, {
        match = "window_type != 'dock'";
        # shader = "my_shader.frag";
    }, {
        match = "window_type = 'dock' || "
                "fullscreen || "
                "monocle || "
                "window_type = 'desktop'";
        corner-radius = 0;
    }, {
        match = "name = 'Notification'   || "
                "class_g = 'Conky'       || "
                "class_g ?= 'Notify-osd' || "
                "class_g = 'Cairo-clock' || "
                "_GTK_FRAME_EXTENTS@";
        shadow = false;
	},
    # {
    #     match = "class_g = 'slop' || class_g = 'maim'";
    #     unredir-if-possible = false;
    # },


    # switch left
    {
        match = "_WS_SLIDE@ = 1";

        animations = (
            {
                triggers = [ "open", "show" ];

                offset-x = {
                    curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
                    duration = 0.3;
                    start = "window-monitor-width";
                    end = 0;
                };

                shadow-offset-x = "offset-x";
            },

            {
                triggers = [ "close", "hide" ];

                offset-x = {
                    curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
                    duration = 0.3;
                    start = 0;
                    end = "-window-monitor-width";
                };

                shadow-offset-x = "offset-x";

                # Keep opacity constant while sliding away.
                opacity = {
                    curve = "linear";
                    duration = 0.3;
                    start = "window-raw-opacity-before";
                    end = "window-raw-opacity-before";
                };

                blur-opacity = 0;
                shadow-opacity = "opacity";
            }
        );
    },

    #switch left
    {
        match = "_WS_SLIDE@ = 2";

        animations = (
            {
                triggers = [ "open", "show" ];

                offset-x = {
                    curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
                    duration = 0.3;
                    start = "-window-monitor-width";
                    end = 0;
                };

                shadow-offset-x = "offset-x";
            },

            {
                triggers = [ "close", "hide" ];

                offset-x = {
                    curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
                    duration = 0.3;
                    start = 0;
                    end = "window-monitor-width";
                };

                shadow-offset-x = "offset-x";

                # Keep opacity constant while sliding away.
                opacity = {
                    curve = "linear";
                    duration = 0.3;
                    start = "window-raw-opacity-before";
                    end = "window-raw-opacity-before";
                };

                blur-opacity = 0;
                shadow-opacity = "opacity";
            }
        );
    }
);



animations = (

    # ---- App opens: zoom in, no fade ---------------------------------------
    {
        triggers = [ "open" ];

        scale-x = {
            curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
            duration = 0.3;
            start = 0;
            end = 1;
        };
        scale-y = "scale-x";

        # Keeps the zoom centred instead of growing out of the top-left corner.
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";

        opacity = 1;
        blur-opacity = 1;
        shadow-opacity = 1;
    },

    # ---- App closes: zoom out, no fade -------------------------------------
    {
        triggers = [ "close", "hide" ];

        scale-x = {
            curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
            duration = 0.3;
            start = 1;
            end = 0;
        };
        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";

        opacity = 1;
        blur-opacity = 1;
        shadow-opacity = 1;
    },

    {
        triggers = [ "show" ];
        opacity = { 
            curve = "linear";
            duration = 0.00;
            start = 1;
            end = 1;
        };
        blur-opacity = 1;
        shadow-opacity = 1;
    },

    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.3;
    }
);