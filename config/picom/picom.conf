#################################
#             Shadows           #
#################################
# shadow = false
# crop-shadow-to-monitor = false


#################################
#           Fading              #
#################################
fading = false;
# fade-in-step = 0.05;
# fade-out-step = 0.05;
# fade-delta = 10
# no-fadingj-openclose = false
# no-fading-destroyed-argb = false


#################################
#   Transparency / Opacity      #
#################################
# frame-opacity = 1;
# inactive-dim-fixed = true


#################################
#           Borders             #
#################################
round-borders = 1;



#################################
#           Corners             #
#################################
corner-radius = 10


#################################
#         Animations            #
#################################
animations = true;

# animation-for-open-window = "zoom";
# animation-for-transient-window = "zoom";
# animation-for-unmap-window = "zoom";


# animation-stiffness = 1000.0;
# animation-dampening = 0.0;
# animation-mass = 1;
# animation-clamping = true;
# animation-delta = 100;

animation-force-steps = true;



#################################
#            Blur               #
#################################
# blur-method =
# blur-size = 12
# blur-deviation = false
# blur-strength = 5
# blur-background = false
# blur-background-frame = false
# blur-background-fixed = false
# blur-kern = "3x3box";

#################################
#       General Settings        #
#################################
# dbus = true
# daemon = false
backend = "glx"
# glx-no-stencil = true;
# glx-no-rebind-pixmap = true;
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-ewmh-active-win = true;
unredir-if-possible = true;
# unredir-if-possible-delay = 1000
detect-transient = true;
detect-client-leader = false
use-damage = true;
# xrender-sync-fence = false
# window-shader-fg = "default"
# force-win-blend = false
# no-ewmh-fullscreen = false
# max-brightness = 1.0
# transparent-clipping = false
# log-level = "warn";
# log-file = "/path/to/your/log/file"
# write-pid-path = "/path/to/your/log/file"

# cubic-bezier(0.25, 0.1, 0.25, 1)



#################################
#             Rules             #
#################################
rules: (
    {
match = "window_type = 'tooltip'";
fade = false;
shadow = false;
opacity = 0.75;
full-shadow = false;
    }, {
match = "window_type = 'dock'    || "
"window_type = 'desktop' || "
"_GTK_FRAME_EXTENTS@";
blur-background = false;
    }, {
match = "window_type != 'dock'";
# shader = "my_shader.frag";
    }, {
match = "window_type = 'dock' || "
"fullscreen || "
"monocle || "
"window_type = 'desktop'";
corner-radius = 0;
    }, {
match = "name = 'Notification'   || "
"class_g = 'Conky'       || "
"class_g ?= 'Notify-osd' || "
"class_g = 'Cairo-clock' || "
"_GTK_FRAME_EXTENTS@";
shadow = false;
    },

# switch left (target desktop is higher)
    {
match = "_WS_SLIDE@ = 1";

animations = (
            {
triggers = [ "open", "show" ];

# While sliding in, ignore anything that would otherwise end the slide
# early: a retile, a focus-driven opacity change, a colour change.
suppressions = [ "size", "position", "increase-opacity",
                 "decrease-opacity", "color" ];

offset-x = {
curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
duration = 0.3;
start = "window-monitor-width";
end = 0;
                };

shadow-offset-x = "offset-x";
            },

            {
triggers = [ "close", "hide" ];

offset-x = {
curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
duration = 0.3;
start = 0;
end = "-window-monitor-width";
                };

shadow-offset-x = "offset-x";

# Keep opacity constant while sliding away.
opacity = {
curve = "linear";
duration = 0.3;
start = "window-raw-opacity-before";
end = "window-raw-opacity-before";
                };

blur-opacity = 0;
shadow-opacity = "opacity";
            }
        );
    },

# switch right (target desktop is lower)
    {
match = "_WS_SLIDE@ = 2";

animations = (
            {
triggers = [ "open", "show" ];

# While sliding in, ignore anything that would otherwise end the slide
# early: a retile, a focus-driven opacity change, a colour change.
suppressions = [ "size", "position", "increase-opacity",
                 "decrease-opacity", "color" ];

offset-x = {
curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
duration = 0.3;
start = "-window-monitor-width";
end = 0;
                };

shadow-offset-x = "offset-x";
            },

            {
triggers = [ "close", "hide" ];

offset-x = {
curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
duration = 0.3;
start = 0;
end = "window-monitor-width";
                };

shadow-offset-x = "offset-x";

# Keep opacity constant while sliding away.
opacity = {
curve = "linear";
duration = 0.3;
start = "window-raw-opacity-before";
end = "window-raw-opacity-before";
                };

blur-opacity = 0;
shadow-opacity = "opacity";
            }
        );
    },

# carried window (send-follow): bspwm unmaps and re-maps it inside one call,
# so keep that invisible and leave it exactly where it is while the rest pans.
    {
match = "_WS_SLIDE@ = 3";

animations = (
            {
triggers = [ "open", "show", "close", "hide" ];

suppressions = [ "size", "position", "increase-opacity",
                 "decrease-opacity", "color" ];

opacity = { curve = "linear"; duration = 0.05; start = 1; end = 1; };
blur-opacity = 1;
shadow-opacity = 1;
            }
        );
    }
);

# Kill the legacy fader so it can't sneak opacity changes back into open/close.
fading = false;

animations = (

    # ---- App opens: zoom in, no fade ---------------------------------------
  {
    triggers = [ "open", "show" ];

    # Ignore anything that would otherwise cut the zoom short (a retile
    # right after mapping, a focus-driven opacity change).
    suppressions = [ "size", "position", "increase-opacity",
                     "decrease-opacity", "color" ];

    scale-x = {
      curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
      duration = 0.2;
      start = 0.8;
      end = 1;
    };
    scale-y = "scale-x";

    # Keeps the zoom centred instead of growing out of the top-left corner.
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";

    opacity = 1;
    blur-opacity = 1;
    shadow-opacity = 1;
  },

    # ---- App closes: zoom out, no fade -------------------------------------
  {
    triggers = [ "close", "hide" ];

    suppressions = [ "close", "size", "position", "increase-opacity",
                     "decrease-opacity", "color" ];

    scale-x = {
      curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
      duration = 0.2;
      start = 1;
      end = 0.8;
    };
    scale-y = "scale-x";

    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";

    opacity = 1;
    blur-opacity = 1;
    shadow-opacity = 1;
  },

  # ---- Retiling: reveal the resize instead of stretching into it --------
  # scale-x/scale-y (used above for open/close) would stretch the window's
  # rendered pixels to fill the new size — fine for a deliberate zoom
  # effect, wrong for a real resize. By the time this fires, the app has
  # already redrawn itself at its real new size, so instead of stretching a
  # texture, we crop a window into that already-correct content and grow
  # the crop from the old rectangle to the new one. Nothing is ever scaled,
  # so what you see is always native-resolution content — more or less of
  # it, never stretched. (This replaces the old geometry-change preset,
  # which picom's own docs say works by stretching old/new content into
  # each other — that's the stretching you were seeing.)
  #
  # scale/offset are pinned to neutral here as a safety net in case this
  # trigger ever interrupts a still-running open or pan animation — without
  # that, an interrupted scale or offset has nothing to reset it and could
  # freeze the window mid-zoom or mid-slide.
  #
  # Both crop-* and the saved-image-blend the old preset relied on are
  # flagged EXPERIMENTAL by picom itself. Worth trying, not guaranteed —
  # I can't test this on real X11 from here.
  {
    triggers = [ "geometry" ];

    # A focus change landing mid-reveal would otherwise end it early.
    suppressions = [ "increase-opacity", "decrease-opacity", "color" ];

    scale-x = 1;
    scale-y = 1;
    offset-x = 0;
    offset-y = 0;

    crop-x = {
      curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
      duration = 0.3;
      start = "window-x-before";
      end = "window-x";
    };
    crop-y = {
      curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
      duration = 0.3;
      start = "window-y-before";
      end = "window-y";
    };
    crop-width = {
      curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
      duration = 0.3;
      start = "window-width-before";
      end = "window-width";
    };
    crop-height = {
      curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
      duration = 0.3;
      start = "window-height-before";
      end = "window-height";
    };
  }

);
