# Tiny 4-bar visualizer for the eww bar. Raw ASCII output, one frame per line: 12;45;78;33;
[general]
bars = 4
framerate = 24
sleep_timer = 1          # idle after a minute of silence

[input]
method = pulse           # also works through pipewire-pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 70
